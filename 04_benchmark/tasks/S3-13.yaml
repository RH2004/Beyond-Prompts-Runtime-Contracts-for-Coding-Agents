task_id: S3-13
title: "List files in a data directory"
repository: study2_repo
base_commit: TBD
type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_list_files(params)` in `app/api/handlers.py`.
  `params["dir"]` (default `""`, the `data/` directory itself) is a directory path relative to the project's `data/` directory, made of segments separated by `/`; it is invalid (`(400, {"error": "invalid path"})`) when it is not a string or has an empty, `.` or `..` segment (the default `""` is allowed) and not found (`(404, {"error": "not found"})`) when no such directory exists.
  The handler returns `(200, {"files": [...]})` with the names of the regular files directly inside that directory (not in
  sub-directories), sorted by name.
