task_id: S3-03
title: "Page through users"
repository: study2_repo
base_commit: TBD
type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_users_page(params)` in `app/api/handlers.py`.
  `params["page"]` (default `"1"`) and `params["page_size"]` (default `"10"`) are strings of digits; `page` must be at least 1 and
  `page_size` between 1 and 50. The handler returns `(200, {"users": [...], "page": p, "page_size": s, "total": n})` with the users of
  that page ordered by id and `total` the number of all users (an empty page past the end is fine). It returns
  `(400, {"error": "invalid paging"})` for any invalid value, including values that are not strings.
  The users are stored in the sqlite database in `app/db/store.py`.
acceptance_tests: [tests/test_users.py]
expected_outcome: patch
