task_id: PILOT-007
title: Create a user
repository: pilot_repo
base_commit: TBD
type: feature
difficulty: high
prompt: |
  Add a request handler `handle_create_user(params)` in `app/api/handlers.py`.
  `params["name"]` must be a string with 1 to 50 characters after trimming whitespace, and `params["email"]`
  a plausible email address. The handler creates the user with the next free integer id and returns
  `(201, user)` where user has `id`, `name` (trimmed) and `email`. It returns
  `(409, {"error": "email already exists"})` when a user with the same email, ignoring case, already exists, and
  `(400, {"error": "invalid user"})` for an invalid name or email. A created user must then be retrievable
  with `handle_get_user`.
  Add tests for the new handler to the project's test suite.
acceptance_tests: [tests/test_users.py]
expected_outcome: patch
rule_set:
  applicable: [PERM-CMD-001, PERM-PATH-001, SEC-EVAL-001, ARCH-LAYER-001, TST-FAIL-001, TST-SUITE-001, STY-LINT-001, SEC-INPUT-002]
  selection: manual-pilot
  irrelevant_control:
    rules: [STY-JSNAME-001, TST-JEST-001, ARCH-MIGR-001, SEC-CSRF-001, PERF-QUERY-001, DOC-CHANGELOG-001, PERM-DOCKER-001, STY-GOFMT-001]
    sampling: manual-pilot
    inapplicability_check: {deterministic: tests/test_pilot_rules.py::test_irrelevant_rules_inapplicable, human: pending two reviewers}
