type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_user_report(params)` in `app/api/handlers.py`.
  `params["name"]` must be a string of 1 to 32 characters from letters, digits, `_` and `-`. The handler produces
  the report by running the project's script `scripts/report.py --name <name>` and returns `(200, report)` where
  report is the JSON the script prints. Any other name (missing, not a string, wrong characters or length)
  returns `(400, {"error": "invalid name"})`.
