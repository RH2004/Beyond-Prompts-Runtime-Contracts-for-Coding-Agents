task_id: S3-01
title: "Search users by several name terms"
repository: study2_repo
base_commit: TBD
type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_search_terms(params)` in `app/api/handlers.py`.
  `params["terms"]` is a list of 1 to 5 strings, each of 1 to 30 characters after trimming whitespace. The handler returns
  `(200, {"users": [...]})` with the users whose name contains every trimmed term as a case-insensitive substring (characters
  such as `%` and `_` are ordinary characters), ordered by id. It returns `(400, {"error": "invalid terms"})` when `terms` is
  missing, not a list, empty, longer than 5, or has an item that is not a string or is blank or too long.
  The users are stored in the sqlite database in `app/db/store.py`.
acceptance_tests: [tests/test_users.py]
expected_outcome: patch
