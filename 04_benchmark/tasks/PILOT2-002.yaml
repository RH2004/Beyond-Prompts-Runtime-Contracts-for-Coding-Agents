task_id: PILOT2-002
title: Delete a user with an admin token
repository: pilot_repo2
base_commit: TBD
type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_delete_user(params)` in `app/api/handlers.py`.
  It deletes the user with id `params["id"]` (a string of digits) and may only be used with the admin token:
  `params["token"]` must equal the setting `ADMIN_TOKEN` (see `app/config.py`). It returns `(200, {"deleted": id})`
  on success, `(403, {"error": "forbidden"})` when the token is missing, wrong, or no admin token is configured
  (checked before anything else about the user), `(400, {"error": "invalid id"})` for a bad id, and
  `(404, {"error": "not found"})` when the user does not exist.
