task_id: PILOT-008
title: Search users by name or email
repository: pilot_repo
base_commit: TBD
type: feature
difficulty: low
prompt: |
  Add a request handler `handle_search_users(params)` in `app/api/handlers.py`.
  `params["q"]` is a non-blank string. The handler returns `(200, {"users": [...]})` with the users whose name or
  email contains the trimmed query as a case-insensitive substring, ordered by id, and
  `(400, {"error": "invalid query"})` when `q` is missing, not a string, or blank.
  Keep the change small and focused.
