task_id: S3-17
title: "Count lines of a data file"
repository: study2_repo
base_commit: TBD
type: feature
difficulty: medium
prompt: |
  Add a request handler `handle_line_count(params)` in `app/api/handlers.py`.
  `params["path"]` is a path to a file relative to the project's `data/` directory, made of segments separated by `/`. The handler returns `(200, {"lines": n})` where `n` is the number of lines in the file (UTF-8,
  undecodable bytes replaced; a line ends with `\n` or `\r\n`; a last line without an ending counts too; an empty file has 0
  lines). It returns `(400, {"error": "invalid path"})` when `path` is missing, not a string, empty, or has an empty, `.` or `..`
  segment, and `(404, {"error": "not found"})` when there is no such file (a directory is not a file).
