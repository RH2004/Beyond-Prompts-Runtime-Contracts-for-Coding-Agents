name: secret-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitignore rules are present and effective
        run: python3 tools/scan_secrets.py --check-ignore
      - name: scan tracked files
        run: python3 tools/scan_secrets.py
      - name: scan full history
        run: python3 tools/scan_secrets.py --history
