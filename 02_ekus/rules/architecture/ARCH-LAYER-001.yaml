# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: ARCH-LAYER-001
version: 0.1.0
title: API handlers must not import the database layer directly
category: architecture
scope:
  languages:
  - python
  paths:
  - app/api/*
  - app/api/**
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- post_edit
contract:
  preconditions: []
  postconditions: []
verification:
  method: static_analysis
check:
  kind: import_deny
  forbidden_prefixes:
  - app.db
failure_policy: request_revision
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: The api layer calls services; only services access app.db. This keeps persistence
  replaceable and testable.
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
