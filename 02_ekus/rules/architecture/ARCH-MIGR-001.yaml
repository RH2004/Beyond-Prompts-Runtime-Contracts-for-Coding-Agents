# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: ARCH-MIGR-001
version: 0.1.0
title: Django model changes require a migration file
category: architecture
scope:
  languages:
  - python
  frameworks:
  - django
  paths:
  - '*/models.py'
  - '*/migrations/*'
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- pre_acceptance
contract:
  preconditions: []
  postconditions: []
verification:
  method: test
check:
  kind: repo_command
  command: python manage.py makemigrations --check --dry-run
failure_policy: request_revision
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: Schema drift between models and migrations breaks deployments and leaves
  databases in inconsistent states.
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
evidence_hash: 9fa2109f610b69a0
