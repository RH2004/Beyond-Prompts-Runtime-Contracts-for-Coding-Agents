# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: DOC-CHANGELOG-001
version: 0.1.0
title: User-visible changes must be recorded in CHANGELOG.md
category: documentation
scope:
  languages:
  - python
  - javascript
  paths:
  - CHANGELOG.md
trigger:
  task_types:
  - release
severity: low
stage:
- pre_acceptance
contract:
  preconditions: []
  postconditions: []
verification:
  method: diff_rule
check:
  kind: repo_command
  command: test -f CHANGELOG.md && git diff --quiet HEAD -- CHANGELOG.md; test $?
    -eq 1
failure_policy: warn
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: Release notes depend on an up-to-date changelog that records every user-visible
  change.
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
evidence_hash: feaa59058043e754
