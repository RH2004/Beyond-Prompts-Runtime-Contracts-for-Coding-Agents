# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: STY-GOFMT-001
version: 0.1.0
title: Go code must be gofmt-formatted
category: style
scope:
  languages:
  - go
  paths:
  - '**/*.go'
trigger:
  task_types:
  - feature
  - bugfix
severity: low
stage:
- pre_acceptance
contract:
  preconditions: []
  postconditions: []
verification:
  method: static_analysis
check:
  kind: repo_command
  command: test -z "$(gofmt -l .)"
failure_policy: request_revision
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: Uniform formatting in Go repositories removes style debates from code review.
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
evidence_hash: d69fb29ea937ad1f
