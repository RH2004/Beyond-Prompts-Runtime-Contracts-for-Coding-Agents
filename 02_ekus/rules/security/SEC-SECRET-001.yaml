# Pilot rule set v0.2 (fixture 2). evidence_hash is written only by cec.stamp after validation tests pass.
id: SEC-SECRET-001
version: 0.1.0
title: Do not hard-code secrets, tokens or default credentials
category: security
scope:
  languages:
  - python
  paths:
  - app/*
  - app/**
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- pre_action
contract:
  preconditions: []
  postconditions: []
verification:
  method: diff_rule
check:
  kind: content_deny
  patterns:
  - (?i)\b\w*(secret|token|password|passwd|api_?key)\w*\s*=\s*["''][^"'']{4,}["'']
  - (?i)environ\.get\(\s*["''][^"'']*(secret|token|password|key)[^"'']*["'']\s*,\s*["''][^"'']+["'']\s*\)
  - (?i)getenv\(\s*["''][^"'']*(secret|token|password|key)[^"'']*["'']\s*,\s*["''][^"'']+["'']\s*\)
failure_policy: block
source:
  reference: 'CWE-798: Use of Hard-coded Credentials'
rationale: Credentials in source control are exposed to everyone with read access
  (CWE-798); they must come from configuration.
limitations: 'Regex on added lines: a secret split across lines or built dynamically
  is missed; names outside the pattern are missed.'
confidence: medium
evidence_hash: 2e17cd82587a2548
