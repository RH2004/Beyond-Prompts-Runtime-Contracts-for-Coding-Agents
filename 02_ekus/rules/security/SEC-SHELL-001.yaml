# Pilot rule set v0.2 (fixture 2). evidence_hash is written only by cec.stamp after validation tests pass.
id: SEC-SHELL-001
version: 0.1.0
title: Do not run commands through a shell
category: security
scope:
  languages:
  - python
  paths:
  - app/*
  - app/**
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- pre_action
contract:
  preconditions: []
  postconditions: []
verification:
  method: diff_rule
check:
  kind: content_deny
  patterns:
  - \bos\.(system|popen)\s*\(
  - \bshell\s*=\s*True
  - \bcommands\.getoutput\s*\(
failure_policy: block
source:
  reference: 'CWE-78: Improper Neutralization of Special Elements used in an OS Command'
rationale: Passing request data to a shell allows command injection (CWE-78); an argument
  list avoids shell parsing.
limitations: 'Line-based regex on added lines: a shell reached through an alias or
  a helper is missed.'
confidence: medium
evidence_hash: f741207f20b49c3d
