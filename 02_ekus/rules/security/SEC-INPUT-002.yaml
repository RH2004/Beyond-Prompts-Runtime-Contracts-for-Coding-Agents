# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: SEC-INPUT-002
version: 0.1.0
title: Untrusted request input must pass the project security scan
category: security
scope:
  languages:
  - python
  components:
  - api
  paths:
  - app/api/*
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- pre_acceptance
contract:
  preconditions: []
  postconditions: []
verification:
  method: static_analysis
check:
  kind: repo_command
  command: semgrep scan --config auto --error --quiet app
  timeout_s: 120
failure_policy: request_revision
source:
  reference: OWASP ASVS v4 V5 (exact requirement to verify)
rationale: Request parameters are untrusted (OWASP ASVS V5). The scanner flags unvalidated
  flows into sinks.
limitations: Requires semgrep in the sandbox; absent in the pilot image by design
  to exercise the unknown path.
confidence: medium
evidence_hash: cea0c8df10238e45
