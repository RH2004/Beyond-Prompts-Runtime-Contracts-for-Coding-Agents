# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: SEC-EVAL-001
version: 0.1.0
title: Do not use eval or exec in application code
category: security
scope:
  languages:
  - python
  paths:
  - app/*
  - app/**
trigger:
  task_types:
  - feature
  - bugfix
severity: critical
stage:
- pre_action
contract:
  preconditions: []
  postconditions: []
verification:
  method: diff_rule
check:
  kind: content_deny
  patterns:
  - \beval\s*\(
  - \bexec\s*\(
failure_policy: block
source:
  reference: 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
    Code'
rationale: Dynamic code execution on data enables code injection (CWE-95).
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
evidence_hash: 2bfc663deadb99ad
