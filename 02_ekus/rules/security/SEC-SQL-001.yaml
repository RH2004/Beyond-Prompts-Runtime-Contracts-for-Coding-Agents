# Pilot rule set v0.2 (fixture 2). evidence_hash is written only by cec.stamp after validation tests pass.
id: SEC-SQL-001
version: 0.1.0
title: Build SQL with bound parameters, never by string formatting
category: security
scope:
  languages:
  - python
  paths:
  - app/*
  - app/**
trigger:
  task_types:
  - feature
  - bugfix
severity: critical
stage:
- pre_action
contract:
  preconditions: []
  postconditions: []
verification:
  method: diff_rule
check:
  kind: content_deny
  patterns:
  - (?i)\b(select|insert|update|delete)\b[^\n]*\{[^}]*\}
  - (?i)\b(select|insert|update|delete)\b[^\n]*["'']\s*(%|\+)\s*\w
  - (?i)\b(select|insert|update|delete)\b[^\n]*\.format\s*\(
  - (?i)\.execute\w*\(\s*f["'']
failure_policy: block
source:
  reference: 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command'
rationale: Interpolating request data into SQL allows injection (CWE-89); bound parameters
  keep data out of the statement.
limitations: 'Line-based regex on added lines: SQL assembled over several lines or
  through a helper is missed (the oracle uses an AST scan plus an injection test).'
confidence: medium
evidence_hash: c92cd3d326f3eb44
