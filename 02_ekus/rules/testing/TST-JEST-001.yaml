# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: TST-JEST-001
version: 0.1.0
title: Every React component must have a Jest snapshot test
category: testing
scope:
  languages:
  - javascript
  frameworks:
  - react
  paths:
  - src/components/**
trigger:
  task_types:
  - feature
  - bugfix
severity: medium
stage:
- pre_acceptance
contract:
  preconditions: []
  postconditions: []
verification:
  method: test
check:
  kind: repo_command
  command: npx jest --ci
failure_policy: request_revision
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: Snapshot tests catch unintended UI changes before they reach users.
limitations: Pilot rule; precision and recall not yet measured.
confidence: medium
evidence_hash: ec1fe00b65e8498b
