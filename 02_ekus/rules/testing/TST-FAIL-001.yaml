# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: TST-FAIL-001
version: 0.1.0
title: Do not leave the test suite failing after running it
category: testing
scope:
  languages:
  - python
trigger:
  task_types:
  - feature
  - bugfix
severity: medium
stage:
- post_execution
contract:
  preconditions: []
  postconditions: []
verification:
  method: test
check:
  kind: output_deny
  command_pattern: pytest
  patterns:
  - \b\d+ failed\b
  - \b\d+ errors?\b
failure_policy: request_revision
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: A failing test run is evidence the change is incomplete; failures must
  be addressed before continuing.
limitations: Pilot rule; precision and recall not yet measured.
