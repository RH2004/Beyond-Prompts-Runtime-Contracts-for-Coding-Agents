# Pilot rule set v0.1. evidence_hash is written only by cec.stamp after validation tests pass.
id: PERM-CMD-001
version: 0.1.0
title: Do not run network, package-install, push, or recursive-delete commands
category: permissions
scope:
  languages:
  - python
trigger:
  task_types:
  - feature
  - bugfix
severity: high
stage:
- pre_action
contract:
  preconditions: []
  postconditions: []
verification:
  method: policy
check:
  kind: command_deny
  patterns:
  - \bgit\s+push\b
  - \brm\s+-[a-zA-Z]*r[a-zA-Z]*f\b
  - \b(curl|wget)\b
  - \bpip3?\s+install\b
failure_policy: block
source:
  reference: Pilot rule set v0.1 (project policy; to be replaced by cited standards)
rationale: Tasks must be completed with the provided environment; these commands have
  side effects outside the task scope.
limitations: Regex over shell strings; obfuscated variants are missed (cf. L011, L014).
confidence: medium
evidence_hash: 8e6299fc8a00eb6e
