# Illustrative example from proposal §4.2. Refine it before use.
id: SEC-INPUT-001
version: 0.1.0
title: Validate untrusted input before use
category: security
scope:
  languages: [python]
  components: [web, api]
trigger:
  task_types: [feature, bugfix, security]
  evidence: [request_parameter, external_payload]
severity: high
stage: [post_edit, post_execution]
contract:
  preconditions:
    - input_origin_is_external
  postconditions:
    - input_is_validated_before_sensitive_use
verification:
  method: static_analysis
  tool: semgrep
  rule_ref: TBD
  unknown_when: data flow crosses a module boundary the tool cannot follow
failure_policy: request_revision
source:
  reference: "OWASP ASVS, input validation chapter (verify exact requirement ID)"
rationale: Unvalidated external input that reaches persistence or a shell is a primary injection vector.
examples:
  pass: [examples/SEC-INPUT-001/pass_schema_validated.py]
  fail: [examples/SEC-INPUT-001/fail_raw_param_to_query.py]
limitations: Checks that validation is present on the path, not that it is semantically adequate.
confidence: medium
